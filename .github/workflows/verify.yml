name: Verify

# Local npm run verify gates pushes; required GitHub checks gate merging to main.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reject newly introduced vulnerable dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

  full-product:
    name: ${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Checks
            lane: checks
            e2e_part: 1
            e2e_parts: 1
          - label: E2E 1/6
            lane: e2e
            e2e_part: 1
            e2e_parts: 6
          - label: E2E 2/6
            lane: e2e
            e2e_part: 2
            e2e_parts: 6
          - label: E2E 3/6
            lane: e2e
            e2e_part: 3
            e2e_parts: 6
          - label: E2E 4/6
            lane: e2e
            e2e_part: 4
            e2e_parts: 6
          - label: E2E 5/6
            lane: e2e
            e2e_part: 5
            e2e_parts: 6
          - label: E2E 6/6
            lane: e2e
            e2e_part: 6
            e2e_parts: 6
    env:
      CI: true
      # Measured hosted baselines (2026-09-06): one runner took 29.7m and timed
      # out six interactions at 1.11x, then exceeded a 45m job cap at 4x. Keep
      # one CPU-safe stack per host and the bounded factor for runner/I/O jitter.
      # Six isolated partitions accommodate suite growth within the same 35m cap.
      E2E_HOST_FACTOR: 4
      VERIFY_E2E_PART: ${{ matrix.e2e_part }}
      VERIFY_E2E_PARTS: ${{ matrix.e2e_parts }}
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use the minimum supported Node.js major
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install the Playwright browser and system dependencies
        if: matrix.lane == 'e2e'
        run: npx playwright install --with-deps chromium

      - name: Verify ${{ matrix.label }}
        run: npm run verify -- ${{ matrix.lane }}
        env:
          E2E_TRACE: '1'

      - name: Preserve failed browser evidence
        if: failure() && matrix.lane == 'e2e'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-failure-${{ matrix.e2e_part }}
          path: test-results/shard-*
          retention-days: 3
          include-hidden-files: false
          if-no-files-found: warn
