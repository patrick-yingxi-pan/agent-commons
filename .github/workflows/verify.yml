name: Verify

# Optional diagnostics only. Local npm run verify is the required pre-push gate.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-product:
    name: ${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Checks
            lane: checks
            e2e_part: 1
            e2e_parts: 1
          - label: E2E 1/2
            lane: e2e
            e2e_part: 1
            e2e_parts: 2
          - label: E2E 2/2
            lane: e2e
            e2e_part: 2
            e2e_parts: 2
    env:
      CI: true
      # Measured hosted baselines (2026-09-06): one runner took 29.7m and timed
      # out six interactions at 1.11x, then exceeded a 45m job cap at 4x. Keep
      # one CPU-safe stack per host, divide the registry across two isolated
      # hosts, and retain the bounded factor for shared-runner/I/O jitter.
      E2E_HOST_FACTOR: 4
      VERIFY_E2E_PART: ${{ matrix.e2e_part }}
      VERIFY_E2E_PARTS: ${{ matrix.e2e_parts }}
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use the minimum supported Node.js major
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install the Playwright browser and system dependencies
        if: matrix.lane == 'e2e'
        run: npx playwright install --with-deps chromium

      - name: Verify ${{ matrix.label }}
        run: npm run verify -- ${{ matrix.lane }}
        env:
          E2E_TRACE: '1'

      - name: Preserve failed browser evidence
        if: failure() && matrix.lane == 'e2e'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-failure-${{ matrix.e2e_part }}
          path: test-results/shard-*
          retention-days: 3
          include-hidden-files: false
          if-no-files-found: warn
